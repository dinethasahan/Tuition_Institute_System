server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: tuition-institute-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tuition}?serverTimezone=Asia/Colombo&characterEncoding=utf8mb4&useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASS:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    # 256-bit secret for HMAC-SHA256
    secret: ${JWT_SECRET:9a4f2c8d7e1b5a0c3f6e8d2b7a4c9f1e0a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d}
    access-expiration-minutes: 15
    refresh-expiration-days: 7
  storage:
    upload-dir: ${STORAGE_PATH:./data/uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,https://institue-mangement-System-frontend.vercel.app,http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
